# HA Supervisor build manifest. `build_from` sets the Dockerfile BUILD_FROM arg
# per-arch; `args` passes the remaining overridable build args.
#
# The defaults target the HAOS GPU-AI reference box (RTX 4090, driver 595.84 /
# CUDA 13.2). A newer driver runs older CUDA runtimes forward-compatibly, so a
# cu128 image is safe here. To track the official ComfyUI recommendation (cu130)
# or to pin an older driver, change the base tag + TORCH_INDEX_URL together.
#
# NOTE: verify the exact base tag exists on Docker Hub before a first build —
# NVIDIA publishes specific patch tags (e.g. 12.8.1) for ubuntu24.04 (Python 3.12,
# which ComfyUI wants). Adjust the patch level if a pull 404s.
build_from:
  amd64: "nvidia/cuda:12.8.1-runtime-ubuntu24.04"
args:
  TORCH_INDEX_URL: "https://download.pytorch.org/whl/cu128"
  # Pin a ComfyUI release tag (e.g. "v0.3.40") for reproducible builds; "master"
  # tracks latest.
  COMFYUI_REF: "master"
